[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-workbench-demo"
version = "0.2.0"
description = "A file-based agentic knowledge-work template: sources, curated records, relationships and reviewed outputs"
requires-python = ">=3.11"
dependencies = ["networkx>=3,<4", "PyYAML>=6,<7", "jsonschema>=4,<5", "mcp>=1.30,<2"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5,<6"]
test = ["pytest>=8,<10"]

[project.scripts]
knowledge-demo = "knowledge_workbench.cli:main"
knowledge-mcp = "knowledge_workbench.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
