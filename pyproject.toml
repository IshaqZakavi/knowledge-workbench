[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-workbench-demo"
version = "0.1.0"
description = "A small, source-linked knowledge system with hybrid retrieval and relationship graphs"
requires-python = ">=3.11"
dependencies = ["networkx>=3,<4", "PyYAML>=6,<7", "mcp>=1.30,<2"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=5,<6"]
test = ["pytest>=8,<10"]

[project.scripts]
knowledge-demo = "knowledge_workbench.cli:main"
knowledge-mcp = "knowledge_workbench.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_workbench = ["data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
